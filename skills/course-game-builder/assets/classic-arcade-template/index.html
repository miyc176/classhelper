<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Course Arcade</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="arcade-app">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="cabinet-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Course Arcade</p>
            <h1 id="game-title">课程精美小游戏合集</h1>
          </div>
        </div>
        <div class="hud" aria-live="polite">
          <div><span id="score">0</span><small>得分</small></div>
          <div><span id="progress">0/0</span><small>掌握</small></div>
          <div><span id="streak">0</span><small>连击</small></div>
        </div>
      </header>

      <section class="arcade-stage">
        <nav class="mode-dock" aria-label="游戏模式">
          <button class="mode-button active" type="button" data-mode="whack">打地鼠</button>
          <button class="mode-button" type="button" data-mode="memory">翻牌</button>
          <button class="mode-button" type="button" data-mode="tictactoe">井字棋</button>
          <button class="mode-button" type="button" data-mode="flappy">飞翔判断</button>
          <button class="mode-button" type="button" data-mode="shooter">雷霆战机</button>
          <button class="mode-button" type="button" data-mode="puzzle">知识拼图</button>
        </nav>

        <section class="playfield" aria-labelledby="mode-title">
          <div class="playfield-visual" aria-hidden="true">
            <div class="signal-grid"></div>
            <div class="visual-chip chip-a"></div>
            <div class="visual-chip chip-b"></div>
            <div class="visual-chip chip-c"></div>
          </div>
          <div class="mission-strip">
            <div>
              <p id="mode-label" class="mode-label">打地鼠</p>
              <h2 id="mode-title">选中正确知识点</h2>
            </div>
            <button id="reset" class="ghost-button" type="button">重置本局</button>
          </div>
          <div id="arena" class="arena" tabindex="-1"></div>
          <div id="feedback" class="feedback" aria-live="polite">选择一个模式开始练习。</div>
        </section>
      </section>
    </main>
    <script src="./game-data.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
